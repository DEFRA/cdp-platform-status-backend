# Squid proxy config for local testing
#
# Allows connections only from localnet (your host via Docker bridge) to
# the domains listed in the allowlist below. Everything else is denied,
# matching the CDP platform behaviour where each service has an explicit
# ACL for permitted outbound domains.
#
# Usage: see README.md "Testing Squid proxy locally" section.

# Standard port/method ACLs
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 1025-65535
acl CONNECT method CONNECT

# Source — Docker bridge / host machine
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16

# Allowed outbound domains (happy-path test targets)
acl allowed_domains dstdomain example.com
acl allowed_domains dstdomain www.gov.uk

# Rules
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
http_access allow localhost
http_access allow localnet allowed_domains
http_access deny all

http_port 3128
coredump_dir /var/spool/squid
logfile_rotate 0
